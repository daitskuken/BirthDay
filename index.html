<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Figtree:wght@400;600&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap">
<style>
/* Layout: one centered column. Greeting on top, a cake with candles to blow out, then a message card. */
:root {
  --bg: #f6eef6;
  --surface: #ffffff;
  --ink: #2a1230;
  --muted: #6e5675;
  --accent: #c2185b;
  --gold: #e8a317;
  --frosting: #f7c6dc;
  --sponge: #f2b872;
  --line: #e2d0e4;
  --paper: #efe0bd;
  --paper-edge: #b89a63;
  --letter-ink: #3a2616;
  --wax: #8e1b2a;
  --env: #d9c295;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-letter: "IM Fell English", Georgia, "Times New Roman", serif;
  --f-script: "Pinyon Script", "Snell Roundhand", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c0e22; --surface: #2a1632; --ink: #fbeefa; --muted: #c7acd0; --accent: #ff6fa8;
    --gold: #ffc545; --frosting: #f08fba; --sponge: #d9955a; --line: #44274f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c0e22; --surface: #2a1632; --ink: #fbeefa; --muted: #c7acd0; --accent: #ff6fa8;
  --gold: #ffc545; --frosting: #f08fba; --sponge: #d9955a; --line: #44274f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; padding-inline: 16px; padding-block: 28px 48px; position: relative; overflow-x: hidden; }
main { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(2.4rem, 9vw, 3.8rem); line-height: 1.05; margin: 6px 0 0; text-wrap: balance; }
h1 em { color: var(--accent); font-style: italic; overflow-wrap: anywhere; }
.cake-wrap { width: 100%; max-width: 340px; }
svg { display: block; width: 100%; height: auto; }
.candle { cursor: pointer; }
.candle:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; transition: opacity .25s, transform .25s; }
.candle:nth-child(2n) .flame { animation-delay: -.4s; }
.candle:nth-child(3n) .flame { animation-delay: -.7s; }
.candle.out .flame { opacity: 0; transform: scale(.2); animation: none; }
.smoke { opacity: 0; }
.candle.out .smoke { animation: smoke 1.4s ease-out; }
@keyframes flick { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.1, 1.18) rotate(3deg); } }
@keyframes smoke { 0% { opacity: .7; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-22px); } }
.hint { min-height: 1.6em; color: var(--muted); font-size: 15px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; width: 100%; text-align: left; }
.card p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.card .sig { margin-top: 14px; font-family: var(--f-display); font-style: italic; color: var(--accent); font-size: 1.15rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { font: inherit; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.edit { width: 100%; display: grid; gap: 10px; text-align: left; }
.edit label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.edit input, .edit textarea { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.edit textarea { min-height: 150px; resize: vertical; }
.intro { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; transition: opacity .5s; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro-in { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 420px; }
.intro h2 { font-family: var(--f-display); font-weight: 500; font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.intro h2 em { color: var(--accent); }
.envbtn { position: relative; width: 100%; max-width: 300px; aspect-ratio: 3 / 2; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 8px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
.envbody, .envfront, .flap { position: absolute; background: var(--env); }
.envbody { inset: 0; border-radius: 8px; }
.envfront { inset: 0; border-radius: 8px; clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); filter: brightness(.9); }
.flap { left: 0; right: 0; top: 0; height: 62%; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .65s ease, filter .65s; filter: brightness(1.08); z-index: 3; border-radius: 8px 8px 0 0; }
.envbtn.open .flap { transform: rotateX(180deg); filter: brightness(.8); z-index: 0; }
.seal { position: absolute; left: 50%; top: 52%; width: 46px; height: 46px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c0392b, var(--wax) 70%); color: #f1d9a0; box-shadow: 0 2px 5px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 22px; z-index: 4; transition: opacity .3s; }
.envbtn.open .seal { opacity: 0; }
.envbtn:not(.open):hover .flap { transform: rotateX(18deg); }
.letter { position: relative; background: radial-gradient(ellipse at 12% 8%, rgba(120,80,30,.16), transparent 45%), radial-gradient(ellipse at 92% 96%, rgba(120,80,30,.22), transparent 50%), var(--paper); color: var(--letter-ink); border: 1px solid var(--paper-edge); border-radius: 3px; padding: 34px 26px 28px; outline: 1px solid rgba(120,80,30,.45); outline-offset: -10px; box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--paper-edge), 0 14px 30px rgba(0,0,0,.28); font-family: var(--f-letter); animation: rise .6s ease-out both; }
.letter::before { content: "\2766"; display: block; text-align: center; color: var(--wax); font-size: 1.6rem; line-height: 1; margin-bottom: 10px; }
.letter p { font-size: 1.12rem; line-height: 1.8; }
.letter p::first-letter { font-family: var(--f-script); font-size: 3.6em; line-height: .8; float: left; padding: .06em .1em 0 0; color: var(--wax); }
.letter .sig { font-family: var(--f-script); font-style: normal; color: var(--wax); font-size: 1.9rem; margin-top: 18px; text-align: right; }
.dear { font-family: var(--f-script); font-size: 2.2rem; line-height: 1.2; margin-bottom: 14px; color: var(--wax); }
.foldbtn { display: block; margin: 24px auto 0; background: transparent; border: 1px solid var(--paper-edge); color: var(--letter-ink); font-family: var(--f-letter); font-weight: 400; font-size: 15px; }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
.bouquet { width: 100%; max-width: 340px; }
.stem { fill: none; stroke: #4c9a52; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.head { transform-box: fill-box; transform-origin: 50% 50%; }
.bloomed .stem { animation: grow 1s ease-out both; }
.bloomed .head { animation: pop .7s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.section-title { font-family: var(--f-display); font-size: 1.4rem; margin: 0; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .flame { animation: none; } }
</style>

<div class="intro" id="intro">
  <div class="intro-in">
    <div class="eyebrow">A surprise is waiting for you</div>
    <h2>Happy <em>Birthday</em></h2>
    <button class="primary" id="startBtn">Tap to open</button>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div>
    <div class="eyebrow">Today is your day</div>
    <h1>Happy Birthday<span id="nameWrap" hidden>, <em id="nameOut"></em></span></h1>
  </div>

  <div class="cake-wrap">
    <svg viewBox="0 0 340 300" role="img" aria-label="Birthday cake with seven candles">
      <g id="candles"></g>
      <rect x="60" y="150" width="220" height="50" rx="8" fill="var(--frosting)"/>
      <path d="M60 170 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q10 14 0 0 V150 H60Z" fill="var(--frosting)"/>
      <rect x="40" y="200" width="260" height="62" rx="10" fill="var(--sponge)"/>
      <rect x="40" y="224" width="260" height="8" fill="var(--frosting)" opacity=".85"/>
      <ellipse cx="170" cy="268" rx="165" ry="12" fill="var(--line)"/>
    </svg>
  </div>
  <p class="hint" id="hint">Tap each candle to blow it out and make a wish.</p>

  <h2 class="section-title">These are for you</h2>
  <div class="bouquet">
    <svg viewBox="0 0 340 230" role="img" aria-label="A bouquet of flowers" id="bq"></svg>
  </div>

  <h2 class="section-title">A letter for you</h2>
  <button class="envbtn" id="envBtn" aria-expanded="false" aria-label="Open the letter">
    <span class="envbody"></span><span class="envfront"></span><span class="flap"></span><span class="seal" aria-hidden="true">♥</span>
  </button>
  <p class="hint" id="envHint">Tap the letter to open it.</p>
  <section class="card letter" id="letter" aria-label="Birthday message" hidden>
    <div class="dear" id="dear"></div>
    <p id="msgOut"></p>
    <div class="sig" id="sigOut"></div>
    <button class="foldbtn" id="foldBtn">Fold the letter</button>
  </section>

  <div class="actions">
    <button class="primary" id="againBtn">Light the candles again</button>
    <button id="musicBtn" aria-pressed="false">Play music</button>
    <button id="flowersBtn">Flowers again</button>
    <button id="confettiBtn">Confetti</button>
    <button id="editBtn" aria-expanded="false">Personalize</button>
  </div>

  <form class="edit" id="editBox" hidden>
    <label for="nameIn">Her name</label>
    <input id="nameIn" autocomplete="off" maxlength="40">
    <label for="msgIn">Your message</label>
    <textarea id="msgIn" maxlength="900"></textarea>
    <label for="sigIn">Signed by</label>
    <input id="sigIn" autocomplete="off" maxlength="40">
    <button class="primary" type="submit">Save</button>
  </form>
</main>

<script>

  function setBtn(on) { $("musicBtn").textContent = on ? "Stop music" : "Play music"; $("musicBtn").setAttribute("aria-pressed", String(on)); }
  function voice(freq, type, t, dur, peak, cutoff, detune, vib) {
    var o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    var a = Math.min(2, dur * .4), r = Math.min(2.2, dur * .5);
    o.type = type; o.frequency.value = freq; o.detune.value = detune || 0;
    f.type = "lowpass"; f.frequency.value = cutoff;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + dur - r); g.gain.linearRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(emo.bus);
    if (vib) { var l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 5; lg.gain.value = 7; l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t + dur + .1); emo.nodes.push(l); }
    o.start(t); o.stop(t + dur + .1); emo.nodes.push(o);
  }
  function scheduleEmo(t0) {
    chords.forEach(function (c, i) {
      var t = t0 + i * 7;
      voice(c.b, "triangle", t, 8.5, .3, 500, 0);
      c.p.forEach(function (fq) { voice(fq, "sawtooth", t, 8.5, .07, 1100, -7); voice(fq, "sawtooth", t, 8.5, .07, 1100, 7); });
      c.m.forEach(function (fq, j) { voice(fq, "triangle", t + j * 3.5, 4.4, .22, 2400, 0, true); });
    });
    return t0 + chords.length * 7;
  }
  function loopEmo(t) {
    if (!emo.on) return;
    var end = scheduleEmo(t);
    emo.timer = setTimeout(function () { loopEmo(end); }, Math.max(1000, (end - actx.currentTime - 2) * 1000));
  }
  function fadeBirthday() {
    if (!playing) return;
    playing = false; timers.forEach(clearTimeout); timers = [];
    var os = osc; osc = [];
    if (birthBus) { try { birthBus.gain.cancelScheduledValues(actx.currentTime); birthBus.gain.setValueAtTime(birthBus.gain.value, actx.currentTime); birthBus.gain.linearRampToValueAtTime(.0001, actx.currentTime + 1.5); } catch (e) {} }
    setTimeout(function () { os.forEach(function (o) { try { o.stop(); } catch (e) {} }); }, 1700);
  }
  function startEmotional() {
    if (emo.on) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) { return; }
    fadeBirthday();
    emo.on = true; emo.nodes = [];
    emo.bus = actx.createGain(); emo.bus.gain.setValueAtTime(.0001, actx.currentTime); emo.bus.gain.linearRampToValueAtTime(1, actx.currentTime + 3);
    var dl = actx.createDelay(1), fb = actx.createGain(), wet = actx.createGain();
    dl.delayTime.value = .37; fb.gain.value = .45; wet.gain.value = .35;
    var comp = actx.createDynamicsCompressor(); comp.connect(actx.destination);
    emo.bus.connect(comp); emo.bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
    setBtn(true);
    loopEmo(actx.currentTime + .2);
  }
  function stopEmotional() {
    if (!emo.on) return;
    emo.on = false; clearTimeout(emo.timer);
    var b = emo.bus, nodes = emo.nodes;
    try { b.gain.cancelScheduledValues(actx.currentTime); b.gain.setValueAtTime(b.gain.value, actx.currentTime); b.gain.linearRampToValueAtTime(.0001, actx.currentTime + 1.2); } catch (e) {}
    setTimeout(function () { nodes.forEach(function (o) { try { o.stop(); } catch (e) {} }); try { b.disconnect(); } catch (e) {} }, 1400);
    setBtn(false);
  }

  // Opening screen: the tap starts the music (browsers only allow sound after a tap)
  $("startBtn").addEventListener("click", function () {
    var intro = $("intro"); intro.classList.add("gone");
    setTimeout(function () { intro.hidden = true; }, 520);
    playMusic(); bloom(); burst(140);
  });

  // Letter
  var envBtn = $("envBtn"), letter = $("letter");
  envBtn.addEventListener("click", function () {
    envBtn.classList.add("open"); envBtn.setAttribute("aria-expanded", "true"); burst(40);
    clearTimeout(resumeTimer); muted = false; startEmotional();
    setTimeout(function () { envBtn.hidden = true; $("envHint").hidden = true; letter.hidden = false; }, 700);
  });
  $("foldBtn").addEventListener("click", function () {
    if (emo.on) { stopEmotional(); if (!muted) resumeTimer = setTimeout(playMusic, 1000); }
    letter.hidden = true; envBtn.classList.remove("open"); envBtn.setAttribute("aria-expanded", "false");
    envBtn.hidden = false; $("envHint").hidden = false;
  });

  // Personalize
  var box = $("editBox");
  $("editBtn").addEventListener("click", function () {
    var open = box.hidden;
    box.hidden = !open; this.setAttribute("aria-expanded", String(open));
    if (open) { $("nameIn").value = state.name; $("msgIn").value = state.msg; $("sigIn").value = state.sig; $("nameIn").focus(); }
  });
  box.addEventListener("submit", function (e) {
    e.preventDefault();
    state = { name: $("nameIn").value.trim() || DEFAULTS.name, msg: $("msgIn").value.trim() || DEFAULTS.msg, sig: $("sigIn").value.trim() };
    try { localStorage.setItem("bday2", JSON.stringify(state)); } catch (err) {}
    render(); box.hidden = true; $("editBtn").setAttribute("aria-expanded", "false"); burst(80);
  });
})();
</script>
